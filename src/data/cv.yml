- title: Research Interests
  type: nested_list
  contents:
    - title: Controllable Generation
      items:
        - Developing generative models that enable fine-grained control over visual generation and editing through structured guidance, feedback-driven refinement, and physical priors.
    - title: World Models
      items:
        - Building world models that learn physical dynamics through perception, interaction, and feedback, enabling prediction and planning in real-world environments.

