name: deploy

# Builds the Astro site and publishes dist/ to a branch that GitHub Pages serves:
#   master / main  → gh-pages
#   redesign-3d    → gh-pages-redesign (preview of the new design; master stays untouched)
# Pick the branch under Settings → Pages → "Deploy from a branch".

on:
  push:
    branches:
      - master
      - main
      - redesign-3d
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: ${{ github.ref_name == 'redesign-3d' && 'gh-pages-redesign' || 'gh-pages' }}
